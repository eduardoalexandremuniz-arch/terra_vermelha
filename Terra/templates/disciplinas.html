<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disciplina</title>
    <link rel="stylesheet" href="../static/css/style_disciplina.css">
</head>
<body>
        <!-- Barra de navegação -->
        <header class="topo">
            <nav class="navbar">
                <div class="logo">
                    <img src="../static/img/logo.jpg" alt="Logo da instituição">
                </div>
                <ul class="menu">
                    <li><a href="/" class="home">Home</a></li>
                    <li><a href="/cursos" class="ativo">Cursos</a></li>
                    <li><a href="/disciplinas" class="disciplinas">Disciplinas</a></li>
                    <li><a href="/conteudos" class="conteudos">Conteúdos</a></li>
                    <li><a href="/alunos" class="alunos">Alunos</a></li>
                    <li><a href="/ranking" class="ranking">Ranking</a></li>
                    <li><a href="/sobre" class="sobre">Sobre</a></li>
                </ul>
                <div class="contato">
                    <img src="../static/img/telefone.png" alt="Ícone de contato" class="icone-contato">
                    <a href="#" class="telefone">Contato</a>
                </div>
            </nav>
        </header>


        <main class="container">
            <h1 class="titulo-formulario">Disciplina</h1>

            <form method="POST">
                <label for="nome_materia">Matéria</label>
                <input type="text" id="nome_materia" name="nome_materia" required />
    
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="4" required></textarea>
                
                <label for="duracao">Carga Horária</label>
                <input type="number" id="duracao" name="duracao" min="1" required />
    
                <label for="curso_id">Curso</label>
                <select id="curso_id" name="curso_id" required>
                    <option value="">Selecione</option>
                    {% for c in cursos %}
                       <option value="{{c.id}}">{{c.nome_curso}}</option>
                    {% endfor %}   
                </select>                    

                <button type="submit">Cadastrar</button>
            </form>

            <h2>Lista de Disciplinas</h2>
            <table border="1">
              <tr>
                <th>ID</th><th>Matéria</th><th>Descrição</th><th>Duração</th><th>ID do curso</th>
              </tr>
              {% for a in registros %}
              <tr>
            <td>{{ a.id }}</td><td>{{ a.nome_materia }}</td><td>{{ a.descricao }}</td><td>{{ a.carga_horaria }} meses</td><td>{{ a.curso_id }}</td>
              </tr>
              {% endfor %}
            </table>
        </main>
</body>
</html>
